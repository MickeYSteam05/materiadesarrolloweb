<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo - Perfil</title>
    <style>
        /* Estilos internos para que no dependas de otros archivos rotos */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #000; /* Fondo negro */
            color: white;
        }

        .header {
            background-color: #111;
            padding: 15px 20px;
            border-bottom: 2px solid #333;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .menu a {
            color: #00d4ff; /* Color azul cian para resaltar */
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        .menu a:hover {
            color: white;
            text-decoration: underline;
        }

        .main-content {
            padding: 40px 20px;
            text-align: center;
            min-height: 70vh;
        }

        /* Contenedor de la tarjeta central */
        .profile-card {
            background-color: #1a1a1a;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .foto {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #00d4ff;
            margin-bottom: 20px;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            color: white;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.1);
        }

        .btn-fb { background-color: #1877f2; }
        .btn-ig { background-color: #e1306c; }

        .footer {
            background-color: #111;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<header class="header">
    <nav class="menu">

        <a href="paginaemilio.html">Emilio</a>
        <a href="paginahoroscopos.html">Horóscopos</a>
    </nav>
</header>

<main class="main-content">

        <h1>Bienvenido a la página de Leo</h1>
        <p>¡Hola! Soy Leo y esta es mi sección del proyecto colaborativo.</p>
        
        <img src="imágenes/fotoleo.jpg" alt="Mi Foto" class="foto">

        <div class="social-buttons">
            <a href="https://www.facebook.com/share/1AmpYkWxJe/" target="_blank" class="btn btn-fb">Facebook</a>
            <a href="https://www.instagram.com/leoo._.rc" target="_blank" class="btn btn-ig">Instagram</a>
        </div>
    </div>

<footer class="footer">
