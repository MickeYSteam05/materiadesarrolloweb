<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo - Perfil Interactivo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #000;
            color: white;
        }

        .header {
            background-color: #111;
            padding: 15px 20px;
            border-bottom: 2px solid #333;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .menu a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        .menu a:hover {
            color: white;
            text-decoration: underline;
        }

        .main-content {
            padding: 40px 20px;
            text-align: center;
            min-height: 70vh;
        }

        .profile-card {
            background-color: #1a1a1a;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .foto {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #00d4ff;
            margin-bottom: 20px;
        }

        /* Sección de Energía */
        .progress-section {
            background: #222;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #00d4ff;
            font-weight: bold;
        }

        progress {
            width: 100%;
            height: 25px;
            appearance: none;
        }

        progress::-webkit-progress-bar {
            background-color: #444;
            border-radius: 12px;
        }

        progress::-webkit-progress-value {
            background-color: #00d4ff;
            border-radius: 12px;
            transition: width 0.4s ease;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .input-group {
            display: flex;
            gap: 5px;
        }

        input[type="number"] {
            width: 60px;
            padding: 8px;
            border-radius: 5px;
            border: none;
            text-align: center;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        .btn-set { background-color: #00d4ff; color: black; }
        .btn-min { background-color: #ff4b2b; }
        .btn-max { background-color: #28a745; }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-main {
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            color: white;
            transition: transform 0.2s;
            display: inline-block;
        }

        .btn-main:hover { transform: scale(1.05); }
        .btn-fb { background-color: #1877f2; }
        .btn-ig { background-color: #e1306c; }

        .footer {
            background-color: #111;
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

<header class="header">
    <nav class="menu">
        <a href="index.html">Inicio</a>
        <a href="paginamickey.html">Mickey</a>
        <a href="paginaroy.html">Roy</a>
        <a href="paginaleo.html">Leo</a>
        <a href="paginaemilio.html">Emilio</a>
        <a href="paginahoroscopos.html">Horóscopos</a>
    </nav>
</header>

<main class="main-content">
    <div class="profile-card">
        <h1>Perfil de Leo</h1>
        <img src="imagenes/fotoleo.jpg" alt="Leo" class="foto">

        <div class="progress-section">
            <label id="label-progreso">Nivel de Energía: 100%</label>
            <progress id="perfil-progreso" value="100" max="100"></progress>
            
            <div class="controls">
                <div class="input-group">
                    <input type="number" id="energia-manual" placeholder="0-100" min="0" max="100">
                    <button onclick="fijarEnergia()" class="btn-small btn-set">Fijar</button>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="bajarAlMinimo()" class="btn-small btn-min">Bajar al Mínimo</button>
                    <button onclick="subirAlMaximo()" class="btn-small btn-max">Subir al Máximo</button>
                </div>
            </div>
        </div>

        <div class="social-buttons">
            <a href="https://www.facebook.com/leonardo.rojascint" target="_blank" class="btn-main btn-fb">Facebook</a>
            <a href="https://www.instagram.com/leoo._.rc" target="_blank" class="btn-main btn-ig">Instagram</a>
        </div>
    </div>
</main>

<footer class="footer">
    <p>© 2026. Leo</p>
</footer>

<script>
    const barra = document.getElementById('perfil-progreso');
    const label = document.getElementById('label-progreso');

    function actualizarTexto(valor) {
        label.innerText = `Nivel de Energía: ${valor}%`;
    }

    function fijarEnergia() {
        const input = document.getElementById('energia-manual');
        let valor = parseInt(input.value);
        
        if (isNaN(valor)) {
            alert("Por favor escribe un número");
            return;
        }
        
        if (valor < 0) valor = 0;
        if (valor > 100) valor = 100;
        
        barra.value = valor;
        actualizarTexto(valor);
    }

    function bajarAlMinimo() {
        barra.value = 0;
        actualizarTexto(0);
        document.getElementById('energia-manual').value = 0;
    }

    function subirAlMaximo() {
        barra.value = 100;
        actualizarTexto(100);
        document.getElementById('energia-manual').value = 100;
    }
</script>

</body>
</html>
