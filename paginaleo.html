<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo - Perfil</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #000;
            color: white;
        }

        .header {
            background-color: #111;
            padding: 15px 20px;
            border-bottom: 2px solid #333;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .menu a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        .menu a:hover {
            color: white;
            text-decoration: underline;
        }

        .main-content {
            padding: 40px 20px;
            text-align: center;
            min-height: 70vh;
        }

        .profile-card {
            background-color: #1a1a1a;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .foto {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #00d4ff;
            margin-bottom: 20px;
        }

        .progress-container {
            margin: 25px 0;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #00d4ff;
            font-weight: bold;
        }

        progress {
            width: 100%;
            height: 20px;
            appearance: none; 
        }

        progress::-webkit-progress-bar {
            background-color: #333;
            border-radius: 10px;
        }

        progress::-webkit-progress-value {
            background-color: #00d4ff;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        #status-text {
            font-size: 14px;
            margin-top: 5px;
            display: block;
            text-align: right;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            color: white;
            transition: transform 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: scale(1.1);
        }

        .btn-fb { background-color: #1877f2; }
        .btn-ig { background-color: #e1306c; }
        .btn-reload { background-color: #444; margin-top: 10px; font-size: 12px; }

        .footer {
            background-color: #111;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

<header class="header">
    <nav class="menu">
        <a href="index.html">Inicio</a>
        <a href="paginamickey.html">Mickey</a>
        <a href="paginaroy.html">Roy</a>
        <a href="paginaleo.html">Leo</a>
        <a href="paginaemilio.html">Emilio</a>
        <a href="paginahoroscopos.html">Horóscopos</a>
    </nav>
</header>

<main class="main-content">
    <div class="profile-card">
        <h1>Bienvenido a la página de Leo</h1>
        <p>¡Hola! Soy Leo y esta es mi sección interactiva.</p>
        
        <img src="imagenes/fotoleo.jpg" alt="Mi Foto" class="foto">

        <div class="progress-container">
            <label for="perfil-progreso">Nivel de Energía:</label>
            <progress id="perfil-progreso" value="0" max="100"></progress>
            <span id="status-text">Cargando... 0%</span>
            <center>
                <button onclick="animarBarra()" class="btn btn-reload">Recargar Energía</button>
            </center>
        </div>

        <div class="social-buttons">
            <a href="https://www.facebook.com/leonardo.rojascint" target="_blank" class="btn btn-fb">Facebook</a>
            <a href="https://www.instagram.com/leoo._.rc" target="_blank" class="btn btn-ig">Instagram</a>
        </div>
    </div>
</main>

<footer class="footer">
    <p>© 2026. All rights reserved to the students.</p>
</footer>

<script>
    function animarBarra() {
        const barra = document.getElementById('perfil-progreso');
        const texto = document.getElementById('status-text');
        let valor = 0;
        barra.value = 0;
        
        const intervalo = setInterval(() => {
            if (valor >= 100) {
                clearInterval(intervalo);
                texto.innerText = "¡Energía al Máximo! 100%";
            } else {
                valor += 1;
                barra.value = valor;
                texto.innerText = "Cargando... " + valor + "%";
            }
        }, 20);
    }

    window.onload = animarBarra;
</script>

</body>
</html>
